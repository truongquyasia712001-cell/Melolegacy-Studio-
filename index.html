<style>
:root{--bg:#111318;--panel:#1b1e25;--panel2:#222630;--gold:#c9a65b;--gold2:#ead49a;--ink:#252525;--paper:#fffefa;--muted:#a9acb5;--line:#454954;--accent:#d7b66d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f1eb;font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #4b4f59;background:#292d36;color:#f5f1e8;border-radius:9px;padding:8px 11px}button:hover,button.active{border-color:var(--gold);background:#393326;color:#ffe6a8}button:disabled{opacity:.4;cursor:not-allowed}
.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #343842;background:#171a20;position:sticky;top:0;z-index:20}.brand{font-weight:750;letter-spacing:.4px;color:var(--gold2);white-space:nowrap}.sub{color:var(--muted);font-size:12px}.grow{flex:1}.mode{font-size:12px;color:var(--gold2);border:1px solid #645638;padding:5px 9px;border-radius:20px}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 54px)}.library{background:#191c22;border-right:1px solid #343842;padding:14px;display:flex;flex-direction:column;gap:10px}.library h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:5px 0}.libitem{text-align:left;background:transparent;border-color:transparent;color:#d9d9d6}.libitem.active{background:#33302a;border-color:#675936}.workspace{min-width:0;display:flex;flex-direction:column}.toolbar{background:#1a1d24;border-bottom:1px solid #343842;padding:7px 12px;display:flex;gap:7px;align-items:center;flex-wrap:nowrap;overflow-x:auto;overflow-y:visible;white-space:nowrap;scrollbar-width:thin}.iconbtn{width:38px;height:36px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:9px;background:transparent;color:#eee8d8;font-size:20px;font-weight:600}.iconbtn:hover,.iconbtn.active,.tool-pop[open]>summary{border-color:#78653e;background:#393326;color:#ffe6a8}.tool-pop{position:relative;flex:0 0 auto}.tool-pop>summary{list-style:none;cursor:pointer}.tool-pop>summary::-webkit-details-marker{display:none}.tool-menu{position:fixed;top:0;left:0;z-index:60;min-width:168px;padding:7px;display:flex;flex-direction:column;gap:4px;background:#222630;border:1px solid #665638;border-radius:11px;box-shadow:0 12px 30px #0009}.tool-menu button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border-color:transparent;padding:9px 11px;white-space:nowrap}.tool-menu button span{font-size:13px}.tool-menu button:hover,.tool-menu button.active{background:#393326;border-color:#78653e}.color-menu{min-width:0}.palette{display:grid;grid-template-columns:repeat(4,26px);gap:9px;padding:7px}.swatch{width:25px;height:25px;border-radius:50%;padding:0;border:2px solid #777}.swatch.active{outline:2px solid var(--gold2);outline-offset:2px}.toolbar-sep{height:25px;width:1px;flex:0 0 1px;background:#414550;margin:0 2px}.small{font-size:12px;padding:7px 9px}.swatch{width:23px;height:23px;border-radius:50%;padding:0;border:2px solid #777}.swatch.active{outline:2px solid var(--gold2);outline-offset:2px}.stage{padding:18px;overflow:auto;flex:1}.paper{background:var(--paper);color:var(--ink);width:min(100%,794px);aspect-ratio:210 / 297;margin:0 auto 25px;padding:38px 42px 36px;box-shadow:0 8px 35px #0008;border-radius:2px;overflow:hidden;display:flex;flex-direction:column}.scorehead{text-align:center;margin-bottom:10px;flex:0 0 auto}.scoretitle{font:bold 22px Georgia,serif;margin:0 0 4px}.scoremeta{font:13px Georgia,serif;color:#555}#systems{flex:1;min-height:0;display:flex;flex-direction:column}.system{position:relative;flex:1 1 0;height:auto;min-height:0;margin:0;background:none;border-bottom:0}.staff-line{position:absolute;left:42px;right:0;height:1px;background:#242424;pointer-events:none}.system:before{content:"";position:absolute;left:42px;top:14px;height:40px;width:1px;background:#222}.clef{position:absolute;left:1px;top:0px;font:60px/60px 'Noto Music','Bravura',Georgia,serif;height:60px;display:block;z-index:2;color:#171717;transform:scaleX(.92);transform-origin:left center}.measureline{position:absolute;top:14px;height:40px;width:1px;background:#222}.note{position:absolute;transform:translate(-50%,-50%);font:28px Georgia,serif;color:#171717;line-height:1;user-select:none;cursor:pointer}.note.selected{filter:drop-shadow(0 0 3px #d6a22b)}.annotation{position:absolute;transform:translate(-50%,-50%);font:20px system-ui,sans-serif;white-space:nowrap;pointer-events:none}.staffhint{font:11px system-ui;color:#777;position:absolute;right:0;top:0}.editoronly{display:block}.presentation .editoronly{display:none!important}.presentation .toolbar{display:none}.presentation .library{display:none}.presentation .shell{display:block}.presentation .paper{width:min(100%,794px);max-width:794px}.presentation .stage{padding:24px}.presentation .top{opacity:.94}.presentation .system{height:auto}
.bottomtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{color:var(--muted);font-size:12px}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modalback.open{display:flex}.modal{width:min(760px,100%);max-height:85vh;overflow:auto;background:#20242c;border:1px solid #62563b;border-radius:15px;padding:18px;box-shadow:0 20px 70px #000b}.modal h2{color:var(--gold2);margin:0 0 12px}.modalhead{display:flex;align-items:center;gap:12px}.modalhead .grow{flex:1}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panelbox{background:#292e38;border:1px solid #414753;border-radius:10px;padding:12px}.piano{display:flex;gap:2px;height:110px;margin-top:12px}.key{flex:1;background:#fff;color:#222;border-radius:0 0 5px 5px;position:relative;padding:0;min-width:22px}.key.black{background:#17191e;color:white;height:68%;z-index:2;margin:0 -13px;max-width:26px}.key:active{background:#e9d49c}.input{background:#14171d;border:1px solid #4a4f59;border-radius:8px;color:white;padding:8px;max-width:100%}.measuretag{position:absolute;top:0;font:10px system-ui;color:#777}.notice{background:#332f25;border:1px solid #685936;color:#e9d7ad;border-radius:9px;padding:10px;margin:10px 0;font-size:12px}
@media(max-width:800px){.shell{grid-template-columns:1fr}.library{display:none}.paper{padding:28px 26px 28px;min-height:0}.stage{padding:8px}.top .sub{display:none}.toolbar{gap:4px;padding:6px 8px}.iconbtn{width:35px;height:34px;flex-basis:35px}.tool-menu{top:40px}.system{margin-left:0;margin-right:0}.presentation .paper{padding:28px 26px}.grid2{grid-template-columns:1fr}}
@page{size:A4 portrait;margin:0}@media print{html,body{width:210mm;height:297mm;background:white}.top,.library,.toolbar,.status,.bottomtools{display:none!important}.shell{display:block;min-height:0}.workspace,.stage{display:block;padding:0;overflow:visible}.paper{display:flex;flex-direction:column;width:210mm;height:297mm;min-height:297mm;aspect-ratio:auto;box-shadow:none;border-radius:0;margin:0;padding:12mm 13mm 10mm;overflow:hidden}.scorehead{margin-bottom:3mm}#systems{display:flex;flex:1;min-height:0;flex-direction:column}.system{height:auto;flex:1 1 0;min-height:0;margin:0;break-inside:avoid}.staff-line{left:11mm}.system:before{left:11mm;top:3.7mm;height:10.5mm}.clef{font-size:16mm;line-height:16mm;height:16mm;top:0}.measureline{top:3.7mm;height:10.5mm}.measuretag{top:0}}
</style></head>
<body>
<header class="top"><div class="brand">♫ MELOLEGACY</div><div class="sub">Professional Notation Studio</div><div class="grow"></div><span class="mode" id="modeLabel">CHẾ ĐỘ SOẠN NHẠC</span><button id="presentBtn" class="small">⛶ Trình diễn</button><button id="saveBtn" class="small">Lưu bản nhạc</button></header>
<div class="shell" id="shell"><aside class="library"><h3>Thư viện âm nhạc</h3><button class="libitem active">♫ Bản nhạc hiện tại</button><button class="libitem" id="newScore">＋ Bản nhạc mới</button><button class="libitem" id="openSaved">▤ Bản nhạc đã lưu</button><div style="flex:1"></div><h3>Công cụ nhanh</h3><button class="libitem" id="openPiano">♧ Đàn piano</button><button class="libitem" id="openTuner">⌁ Bộ chỉnh cao độ</button><button class="libitem" id="openMetro">◷ Máy đếm nhịp</button><button class="libitem" id="openResearch">✎ Phòng nghiên cứu</button></aside>
<main class="workspace"><div class="toolbar editoronly" id="editorToolbar" aria-label="Thanh công cụ soạn nhạc">
<button class="iconbtn active" data-tool="select" title="Chọn" aria-label="Chọn">↖</button>
<button class="iconbtn" data-tool="note" title="Thêm nốt nhạc" aria-label="Thêm nốt nhạc">♩</button>
<button class="iconbtn" data-tool="rest" title="Thêm dấu lặng" aria-label="Thêm dấu lặng">𝄽</button>
<details class="tool-pop"><summary class="iconbtn" title="Văn bản" aria-label="Văn bản">T</summary><div class="tool-menu"><button data-tool="text" title="Thêm văn bản">T <span>Văn bản</span></button></div></details>
<details class="tool-pop"><summary class="iconbtn" title="Bút và ghi chú" aria-label="Bút và ghi chú">✎</summary><div class="tool-menu"><button data-tool="pen" title="Bút ghi chú">✎ <span>Bút</span></button><button data-tool="highlighter" title="Bút đánh dấu">▰ <span>Bút đánh dấu</span></button><button data-tool="eraser" title="Tẩy">⌫ <span>Tẩy</span></button></div></details>
<details class="tool-pop"><summary class="iconbtn" title="Bảng màu" aria-label="Bảng màu">◉</summary><div class="tool-menu color-menu"><div class="palette" id="palette"></div></div></details>
<span class="toolbar-sep"></span>
<button class="iconbtn" id="addSystem" title="Thêm hệ thống" aria-label="Thêm hệ thống">▤</button>
<button class="iconbtn" id="addMeasure" title="Thêm ô nhịp" aria-label="Thêm ô nhịp">▥</button>
<button class="iconbtn" id="undoBtn" title="Hoàn tác" aria-label="Hoàn tác">↶</button>
<span class="toolbar-sep"></span>
<button class="iconbtn" id="researchBtn" title="Phòng nghiên cứu AI" aria-label="Phòng nghiên cứu AI">✧</button>
<button class="iconbtn" id="exportXml" title="Xuất MusicXML" aria-label="Xuất MusicXML">XML</button>
<button class="iconbtn" id="exportJson" title="Xuất JSON" aria-label="Xuất JSON">{ }</button>
<button class="iconbtn" id="printBtn" title="In / Lưu PDF" aria-label="In / Lưu PDF">▧</button>
</div>
<div class="stage" id="stage"><section class="paper" id="paper"><div class="scorehead"><h1 class="scoretitle" contenteditable="true" id="scoreTitle">Bản nhạc mới</h1><div class="scoremeta" contenteditable="true" id="scoreMeta">Sáng tác · MeloLegacy</div></div><div id="systems"></div></section><div class="bottomtools"><span class="status" id="status">Sẵn sàng · Chạm vào khuông nhạc để thêm ký hiệu</span><span class="grow"></span><button class="small" id="playBtn">▶ Phát bản nhạc</button><button class="small" id="stopBtn">■ Dừng</button></div></div></main></div>
<div class="modalback" id="modal"><section class="modal"><div class="modalhead"><h2 id="modalTitle">Công cụ</h2><div class="grow"></div><button id="closeModal">Đóng ✕</button></div><div id="modalBody"></div></section></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let tool='select',color='#d84a4a',systems=10,measures=5,items=[],history=[],selected=null,audioCtx=null,metroTimer=null,metroOn=false;
const colors=['#d84a4a','#e58a36','#e0c34b','#3d9b65','#3985c9','#8a63c7','#222222','#777777'];
const palette=$('#palette');colors.forEach(c=>{let b=document.createElement('button');b.className='swatch'+(c===color?' active':'');b.style.background=c;b.title=c;b.onclick=()=>{color=c;$$('.swatch').forEach(x=>x.classList.toggle('active',x===b))};palette.append(b)});
function setTool(t){tool=t;$('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('.tool-pop').forEach(p=>p.open=false);$('#status').textContent='Công cụ: '+({select:'Chọn',note:'Thêm nốt',rest:'Thêm dấu lặng',text:'Văn bản',pen:'Bút ghi chú',highlighter:'Bút đánh dấu',eraser:'Tẩy'}[t]||t)}
$('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('.tool-pop').forEach(p=>p.addEventListener('toggle',()=>{if(p.open){const r=p.querySelector('summary').getBoundingClientRect(),m=p.querySelector('.tool-menu');m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-m.offsetWidth-8))+'px'}}));
function snapshot(){history.push(JSON.stringify(items));if(history.length>40)history.shift()}
function draw(){const host=$('#systems');host.innerHTML='';for(let s=0;s<systems;s++){let el=document.createElement('div');el.className='system';el.dataset.system=s;for(let staffIndex=0;staffIndex<5;staffIndex++){let staffLine=document.createElement('i');staffLine.className='staff-line';staffLine.style.top=(14+staffIndex*10)+'px';el.append(staffLine)}let clef=document.createElement('span');clef.className='clef';clef.textContent='𝄞';el.append(clef);for(let m=0;m<=measures;m++){let line=document.createElement('i');line.className='measureline';line.style.left=(7+(m/measures)*90)+'%';line.style.top='14px';line.style.height='40px';el.append(line);if(m<measures){let tag=document.createElement('span');tag.className='measuretag';tag.style.left=(7.5+(m/measures)*90)+'%';tag.textContent=(m+1);el.append(tag)}}let hint=document.createElement('span');hint.className='staffhint';hint.textContent='Hệ thống '+(s+1);el.append(hint);host.append(el)}
items.forEach((it,i)=>{let sys=host.children[it.s];if(!sys)return;let node=document.createElement('span');node.className=it.kind==='annotation'?'annotation':'note';if(i===selected)node.classList.add('selected');node.style.left=it.x+'%';node.style.top=it.y+'px';node.style.color=it.color||'#171717';if(it.kind==='annotation'){node.textContent=it.text;node.style.background=it.tool==='highlighter'?(it.color+'44'):'transparent';node.style.borderBottom=it.tool==='pen'?'2px solid '+it.color:'none'}else node.textContent=it.symbol;node.onclick=e=>{e.stopPropagation();selected=i;draw()};sys.append(node)});
host.querySelectorAll('.system').forEach((el,s)=>{el.onclick=e=>{if(tool==='select'){selected=null;draw();return}const r=el.getBoundingClientRect(),x=Math.max(8,Math.min(97,(e.clientX-r.left)/r.width*100)),y=Math.max(12,Math.min(92,e.clientY-r.top));snapshot();if(tool==='eraser'){let idx=items.findIndex(a=>a.s===s&&Math.abs(a.x-x)<5&&Math.abs(a.y-y)<24);if(idx>=0)items.splice(idx,1)}else if(tool==='note'||tool==='rest'){let sym=tool==='rest'?'𝄽':'♩';items.push({s,x,y,kind:'note',symbol:sym,color:'#171717',pitch:Math.round((88-y)/7)})}else if(tool==='text'){let txt=prompt('Nội dung ghi chú:');if(txt)items.push({s,x,y,kind:'annotation',tool,color,text:txt})}else if(tool==='pen'||tool==='highlighter'){items.push({s,x,y,kind:'annotation',tool,color,text:tool==='pen'?'✎':' '})}draw()}})}
draw();
$('#undoBtn').onclick=()=>{if(history.length){items=JSON.parse(history.pop());selected=null;draw()}};
$('#addSystem').onclick=()=>{systems++;draw()};$('#addMeasure').onclick=()=>{measures++;draw()};
function mode(p){document.body.classList.toggle('presentation',p);$('#modeLabel').textContent=p?'CHẾ ĐỘ TRÌNH DIỄN':'CHẾ ĐỘ SOẠN NHẠC';$('#presentBtn').textContent=p?'↗ Trở về soạn':'⛶ Trình diễn';$('#status').textContent=p?'Toàn màn hình bản nhạc · Chạm hai ngón tay để mở công cụ soạn':'Chế độ soạn nhạc · Chạm hai ngón tay để trình diễn'}
$('#presentBtn').onclick=()=>mode(!document.body.classList.contains('presentation'));
let twoStart=0,twoMoved=false;document.addEventListener('touchstart',e=>{if(e.touches.length===2){twoStart=Date.now();twoMoved=false}}, {passive:true});document.addEventListener('touchmove',e=>{if(e.touches.length===2)twoMoved=true},{passive:true});document.addEventListener('touchend',e=>{if(twoStart&&Date.now()-twoStart<450&&!twoMoved){mode(!document.body.classList.contains('presentation'))}twoStart=0},{passive:true});
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
function openPiano(){modal('Đàn piano ảo','<p class="muted">Bàn phím thử âm thanh · Chạm phím để nghe cao độ</p><div class="piano" id="pianoKeys"></div><p class="muted">Âm thanh hiện tại là bộ phát âm thử nghiệm tích hợp, chưa phải thư viện mẫu piano chuyên nghiệp.</p>');const keys=$('#pianoKeys');const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];for(let n=0;n<24;n++){let b=document.createElement('button');b.className='key'+([1,3,6,8,10,13,15,18,20,22].includes(n%12)?' black':'');b.textContent=names[n%12];b.onclick=()=>tone(261.63*Math.pow(2,(n-0)/12));keys.append(b)}}
function tone(freq,dur=.55){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){$('#status').textContent='Thiết bị chưa hỗ trợ phát âm thanh'}}
function openTuner(){modal('Bộ chỉnh cao độ','<div class="panelbox"><p>Cho phép sử dụng micro để đo cao độ đầu vào.</p><button id="startTune">Bật micro</button><h1 id="tuneNote">—</h1><p id="tuneHz" class="muted">Chưa có dữ liệu</p><label>Âm chuẩn (Hz) <select id="refHz" class="input"><option>440</option><option>442</option><option>430</option><option>444</option></select></label><p class="muted">Tuner thử nghiệm dùng micro thiết bị; cần cấp quyền truy cập.</p></div>');$('#startTune').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=audioCtx||new AudioContext();const src=audioCtx.createMediaStreamSource(stream),an=audioCtx.createAnalyser();an.fftSize=4096;src.connect(an);let buf=new Float32Array(an.fftSize);function tick(){if(!$('#tuneHz')){stream.getTracks().forEach(t=>t.stop());return}an.getFloatTimeDomainData(buf);let best=0;for(let lag=30;lag<1000;lag++){let sum=0;for(let j=0;j<buf.length-lag;j+=4)sum+=buf[j]*buf[j+lag];if(sum>best){best=sum;var bestLag=lag}}if(bestLag){let hz=audioCtx.sampleRate/bestLag,ref=Number($('#refHz').value),midi=Math.round(69+12*Math.log2(hz/ref*440/440)),note=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'][(midi%12+12)%12],target=ref*Math.pow(2,(midi-69)/12),cents=1200*Math.log2(hz/target);$('#tuneNote').textContent=note+(Math.floor(midi/12)-1);$('#tuneHz').textContent=hz.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents.toFixed(0)+' cents'}requestAnimationFrame(tick)}tick()}catch(e){$('#tuneHz').textContent='Không mở được micro. Hãy kiểm tra quyền truy cập.'}}}
function openMetro(){modal('Máy đếm nhịp','<div class="panelbox"><label>Tốc độ <strong id="bpmVal">80</strong> BPM</label><input class="input" id="bpm" type="range" min="30" max="240" value="80" style="width:100%"><p><button id="metroToggle">▶ Bắt đầu</button> <span id="beatText" class="muted">Sẵn sàng</span></p><label>Phách / ô nhịp <select class="input" id="beats"><option>2</option><option>3</option><option selected>4</option><option>6</option></select></label></div>');$('#bpm').oninput=()=>$('#bpmVal').textContent=$('#bpm').value;$('#metroToggle').onclick=()=>{if(metroOn){clearInterval(metroTimer);metroOn=false;$('#metroToggle').textContent='▶ Bắt đầu';return}metroOn=true;$('#metroToggle').textContent='■ Dừng';let beat=0;const tick=()=>{tone(beat%Number($('#beats').value)===0?880:660,.09);$('#beatText').textContent='Phách '+(beat%Number($('#beats').value)+1);beat++};tick();metroTimer=setInterval(tick,60000/Number($('#bpm').value))}}
$('#openPiano').onclick=openPiano;$('#openTuner').onclick=openTuner;$('#openMetro').onclick=openMetro;
function openResearch(){let saved=JSON.parse(localStorage.getItem('meloSamples')||'[]');modal('Phòng nghiên cứu · MOMD','<div class="notice">Kho A là dữ liệu cá nhân. Chỉ lưu mẫu vào thiết bị này khi anh chủ động xác nhận. Kho B cộng đồng chưa được bật; cần quy trình kiểm duyệt, quyền sử dụng và đồng ý riêng.</div><div class="grid2"><div class="panelbox"><h3>Ghi nhận mẫu viết</h3><p class="muted">Chọn một ký hiệu trên bản nhạc hoặc tạo mẫu minh họa để gắn nhãn.</p><label>Nhãn ký hiệu<br><input id="sampleLabel" class="input" placeholder="Ví dụ: nốt đen"></label><p><label><input id="sampleConsent" type="checkbox"> Tôi đồng ý lưu mẫu này vào Kho A trên thiết bị</label></p><button id="saveSample">Lưu mẫu vào Kho A</button></div><div class="panelbox"><h3>Thống kê Kho A</h3><h1>'+saved.length+'</h1><p class="muted">Mẫu đã lưu trên thiết bị</p><button id="clearSamples">Xóa toàn bộ mẫu Kho A</button></div></div><h3>Hàng đợi mẫu cá nhân</h3><div id="sampleList">'+(saved.map(x=>'<p>• '+escapeHtml(x.label)+' <span class="muted">— '+x.date+'</span></p>').join('')||'<p class="muted">Chưa có mẫu.</p>')+'</div><p class="muted">Lưu ý: đây là giao diện thu thập nhãn ban đầu, chưa phải mô hình nhận dạng hay hệ thống huấn luyện AI thực tế.</p>');$('#saveSample').onclick=()=>{if(!$('#sampleConsent').checked){alert('Anh cần xác nhận đồng ý lưu mẫu vào Kho A.');return}let label=$('#sampleLabel').value.trim();if(!label){alert('Hãy nhập nhãn ký hiệu.');return}let a=JSON.parse(localStorage.getItem('meloSamples')||'[]');a.push({label,date:new Date().toLocaleString('vi-VN')});localStorage.setItem('meloSamples',JSON.stringify(a));openResearch()};$('#clearSamples').onclick=()=>{if(confirm('Xóa toàn bộ mẫu Kho A trên thiết bị này?')){localStorage.removeItem('meloSamples');openResearch()}}}
$('#researchBtn').onclick=openResearch;$('#openResearch').onclick=openResearch;
$('#newScore').onclick=()=>{if(confirm('Tạo bản nhạc mới? Bản hiện tại cần được lưu trước nếu muốn giữ lại.')){items=[];systems=10;measures=5;$('#scoreTitle').textContent='Bản nhạc mới';draw()}};
$('#saveBtn').onclick=()=>{localStorage.setItem('meloScore',JSON.stringify({title:$('#scoreTitle').textContent,meta:$('#scoreMeta').textContent,systems,measures,items}));$('#status').textContent='Đã lưu bản nhạc trên thiết bị này'};
$('#openSaved').onclick=()=>{let d=JSON.parse(localStorage.getItem('meloScore')||'null');if(!d){alert('Chưa có bản nhạc đã lưu.');return}$('#scoreTitle').textContent=d.title;$('#scoreMeta').textContent=d.meta;systems=d.systems;measures=d.measures;items=d.items||[];draw();$('#status').textContent='Đã mở bản nhạc đã lưu'};
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
$('#exportJson').onclick=()=>download('melolegacy-score.json',JSON.stringify({title:$('#scoreTitle').textContent,meta:$('#scoreMeta').textContent,systems,measures,items},null,2),'application/json');
$('#exportXml').onclick=()=>{let notes=items.filter(x=>x.kind==='note').map(x=>'<note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><type>quarter</type></note>').join('');let xml='<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd"><score-partwise version="4.0"><work><work-title>'+escapeXml($('#scoreTitle').textContent)+'</work-title></work><part-list><score-part id="P1"><part-name>Piano</part-name></score-part></part-list><part id="P1"><measure number="1"><attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>'+notes+'</measure></part></score-partwise>';download('melolegacy-score.musicxml',xml,'application/vnd.recordare.musicxml+xml')};
function escapeXml(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]))}function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('#printBtn').onclick=()=>window.print();$('#playBtn').onclick=()=>{let ns=items.filter(x=>x.kind==='note');if(!ns.length){tone(440);$('#status').textContent='Chưa có nốt; đang phát âm thử A4';return}ns.forEach((n,i)=>setTimeout(()=>tone(261.63*Math.pow(2,(n.pitch||0)/12)),i*420));$('#status').textContent='Phát thử các nốt đã thêm · âm thanh tổng hợp cơ bản'};$('#stopBtn').onclick=()=>{if(audioCtx)audioCtx.suspend().then(()=>audioCtx.resume());$('#status').textContent='Đã dừng phát thử'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')});
})();
</script></body></html>
