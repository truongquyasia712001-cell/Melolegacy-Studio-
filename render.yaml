# MeloLegacy Preview on Render
# Intentionally deploys only the static PWA.
# MeloBot Gateway and OMR Worker remain disabled until trusted auth ingress
# and private worker networking are configured and verified.

services:
  - type: web
    runtime: static
    name: melolegacy-preview
    branch: integration/unified-pwa-mainline
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
