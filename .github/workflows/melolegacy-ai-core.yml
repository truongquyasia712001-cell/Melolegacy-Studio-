name: MeloLegacy AI Core checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [ai-core-bootstrap]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile AI and service modules
        run: |
          python -m py_compile ai/core/orchestrator.py
          python -m py_compile services/melobot-gateway/app.py
          python -m py_compile services/omr-worker/app.py
      - name: Run task-conveyor tests
        working-directory: ai/core
        run: python -m unittest -v test_orchestrator.py
      - name: Check Composer Room browser script syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("app/composer-room/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          assert scripts, "No inline application script found"
          Path("/tmp/composer-room-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/composer-room-check.js

      - name: Test Composer Room MusicXML duration export
        run: node app/composer-room/test-musicxml.js
