name: Melo Legacy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/melo-music-recognition-engine]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
