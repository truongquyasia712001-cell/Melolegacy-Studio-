name: MeloLegacy AI Core tests

on:
  pull_request:
    branches: [ai-core-bootstrap, main]
  push:
    branches: [ai-core-bootstrap, main, melobot-memory-v0]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install gateway test dependencies
        run: python -m pip install -r services/melobot-gateway/requirements.txt
      - name: Compile AI Core and services
        run: |
          python -m compileall -q ai/core
          python -m py_compile services/melobot-gateway/app.py
          python -m py_compile services/omr-worker/app.py
      - name: Run AI Core tests
        working-directory: ai/core
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run gateway and OMR worker boundary tests
        run: python -m unittest discover -s services/tests -p 'test_*.py' -v

  omr-worker-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build pinned OMR worker image
        run: docker build -t melo-omr-ci services/omr-worker
      - name: Verify score-reader CLI is installed
        run: docker run --rm melo-omr-ci score-reader --help
      - name: Verify private worker starts and reports health
        run: |
          docker run -d --name melo-omr-ci -p 127.0.0.1:8000:8000 \
            -e MELOBOT_OMR_TOKEN=ci-only-secret melo-omr-ci
          trap 'docker rm -f melo-omr-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs melo-omr-ci
          exit 1
