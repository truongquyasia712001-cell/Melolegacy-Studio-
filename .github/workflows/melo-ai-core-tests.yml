name: MeloLegacy AI Core tests

on:
  pull_request:
    branches: [ai-core-bootstrap, main]
  push:
    branches: [ai-core-bootstrap, main, melobot-memory-v0]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway test dependencies
        run: python -m pip install -r services/melobot-gateway/requirements.txt
      - name: Compile AI Core and services
        run: |
          python -m compileall -q ai/core
          python -m py_compile services/melobot-gateway/app.py
          python -m py_compile services/omr-worker/app.py
      - name: Run AI Core tests
        working-directory: ai/core
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run gateway and OMR worker boundary tests
        run: python -m unittest discover -s services/tests -p 'test_*.py' -v
