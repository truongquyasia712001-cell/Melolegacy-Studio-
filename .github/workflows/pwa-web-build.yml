name: MeloLegacy PWA build

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/pwa-web-build.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/pwa-web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build PWA
        working-directory: apps/web
        run: npm run build
